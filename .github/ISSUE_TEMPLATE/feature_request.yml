name: Feature request
description: Propose an improvement for Ratogram X
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior and where it belongs in the Telegram X interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: references
    attributes:
      label: Mockups or references
      description: UI proposals should include a mockup that follows the Telegram X style.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request.
          required: true
        - label: This request is specific enough to discuss or implement.
          required: true
