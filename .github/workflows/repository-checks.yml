name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
          submodules: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check public repository contents
        run: bash scripts/check-public-repo.sh

      - name: Check Ratogram string parity
        run: bash scripts/check-strings.sh
