name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
          submodules: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check public repository contents
        run: bash scripts/check-public-repo.sh

      - name: Check Ratogram string parity
        run: bash scripts/check-strings.sh

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [LatestArm64, LollipopArm32]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "cmake;3.22.1" "ndk;30.0.16248370" "ndk;23.2.8568313"
      - name: Configure compile-only credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '12345' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '00000000000000000000000000000000' }}
        run: |
          cp local.properties.sample local.properties
          cp gradle.properties.sample gradle.properties
          sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_HOME|" local.properties
          sed -i "s|^telegram.api_id=.*|telegram.api_id=$TELEGRAM_API_ID|" local.properties
          sed -i "s|^telegram.api_hash=.*|telegram.api_hash=$TELEGRAM_API_HASH|" local.properties
      - name: Compile Java sources
        run: ./gradlew :app:compile${{ matrix.variant }}DebugJavaWithJavac -PratogramxDevPackage=true --no-daemon --stacktrace
      - name: Run JVM unit tests
        if: matrix.variant == 'LatestArm64'
        run: ./gradlew :app:testLatestArm64DebugUnitTest -PratogramxDevPackage=true --no-daemon --stacktrace
      - name: Assemble Android 5 ARM32 debug APK
        if: matrix.variant == 'LollipopArm32'
        run: ./gradlew :app:assembleLollipopArm32Debug -PratogramxDevPackage=true --no-daemon --stacktrace

  assemble:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "cmake;3.22.1" "ndk;30.0.16248370" "ndk;23.2.8568313"
      - name: Configure local properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '12345' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '00000000000000000000000000000000' }}
        run: |
          cp local.properties.sample local.properties
          cp gradle.properties.sample gradle.properties
          sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_HOME|" local.properties
          sed -i "s|^telegram.api_id=.*|telegram.api_id=$TELEGRAM_API_ID|" local.properties
          sed -i "s|^telegram.api_hash=.*|telegram.api_hash=$TELEGRAM_API_HASH|" local.properties
      - name: Assemble ARM64 debug APK
        run: ./gradlew :app:assembleLatestArm64Debug -PratogramxDevPackage=true --no-daemon --stacktrace
